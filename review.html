    // Decompress a URL-safe Base64 compressed string back into a JSON string
    async function decompressPayload(base64) {
      try {
        let b64 = base64.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) {
          b64 += '=';
        }
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const stream = new Blob([bytes]).stream();
        const decompressedStream = stream.pipeThrough(new DecompressionStream('deflate'));
        const response = new Response(decompressedStream);
        return await response.text();
      } catch (e) {
        console.error('Failed to decompress payload', e);
        return null;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Send webhook with retry logic to handle rate-limits and network failures
      async function sendWithRetry(url, body, method, retries, delay) {
        method = method || 'POST';
        retries = retries || 3;
        delay = delay || 1000;

        for (let i = 0; i < retries; i++) {
          try {
            const resp = await fetch(url, {
              method: method,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });

            if (resp.status === 429) {
              const rateLimitData = await resp.json();
              const retryAfter = (rateLimitData.retry_after * 1000) || delay;
              console.warn(`Rate limited by Discord. Retrying after ${retryAfter}ms...`);
              await new Promise(resolve => setTimeout(resolve, retryAfter));
              continue;
            }

            return resp;
          } catch (e) {
            if (i === retries - 1) throw e;
            console.warn(`Request failed. Retrying in ${delay}ms...`, e);
            await new Promise(resolve => setTimeout(resolve, delay));
          }
        }
      }

      const urlParams = new URLSearchParams(window.location.search);
      const actionParam = urlParams.get('action'); // 'approve' or 'reject'
      const rawAnswers = urlParams.get('answers');
      const tagParam = urlParams.get('tag') || 'Unknown Applicant';
      const messageId = urlParams.get('message_id');

      const loadingView = document.getElementById('loading-view');
      const reviewView = document.getElementById('review-view');
      const statusView = document.getElementById('status-view');
      const answersContainer = document.getElementById('answers-container');

      const applicantName = document.getElementById('applicant-name');
      const applicantId = document.getElementById('applicant-id');
      const appStatus = document.getElementById('application-status');

      const reviewerNameInput = document.getElementById('reviewer_name');
      const approveBtn = document.getElementById('approve-btn');
      const rejectBtn = document.getElementById('reject-btn');
      const actionBox = document.getElementById('action-box');

      const statusIconSuccess = document.getElementById('status-icon-success');
      const statusIconError = document.getElementById('status-icon-error');
      const statusTitle = document.getElementById('status-title');
      const statusMessage = document.getElementById('status-message');
      const statusBackBtn = document.getElementById('status-back-btn');

      // Autofill reviewer name if stored in local storage
      const savedReviewer = localStorage.getItem('reviewer_name');
      if (savedReviewer) {
        reviewerNameInput.value = savedReviewer;
      }
      let parsedAnswers = null;
      let fromEmbed = false;
      let embedQuestions = [];

      // 1. Try to fetch from Discord Message ID if it's available
      if (messageId && messageId !== 'TEMP_MSG_ID') {
        try {
          const fetchUrl = `${CONFIG.WEBHOOK_URL}/messages/${messageId}`;
          const res = await fetch(fetchUrl);
          if (res.ok) {
            const msgData = await res.json();
            if (msgData.embeds && msgData.embeds[0]) {
              const embed = msgData.embeds[0];
              parsedAnswers = {};

              embed.fields.forEach(f => {
                const nameClean = f.name.replace(/[\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDFFF]/g, '').trim();
                let valClean = f.value.trim();

                if (nameClean.includes('Applied Role')) {
                  parsedAnswers.role_title = valClean;
                  if (valClean.includes('Staff')) parsedAnswers.role = 'discord_staff';
                  else if (valClean.includes('Media')) parsedAnswers.role = 'media_team';
                  else if (valClean.includes('Dev')) parsedAnswers.role = 'rbx_dev';
                  else if (valClean.includes('Tester')) parsedAnswers.role = 'beta_tester';
                } else if (nameClean.includes('Discord Username')) {
                  parsedAnswers.discord_tag = valClean;
                } else if (nameClean.includes('Discord User ID')) {
                  parsedAnswers.discord_id = valClean.replace(/`/g, '');
                } else if (nameClean.includes('Age')) {
                  parsedAnswers.age = valClean;
                } else if (nameClean.includes('Timezone')) {
                  parsedAnswers.timezone = valClean;
                } else if (nameClean.includes('Hours / Week')) {
                  parsedAnswers.hours_active = valClean.replace(/\*\*| hrs/g, '');
                } else if (nameClean.includes('Specialization')) {
                  parsedAnswers.media_role = valClean;
                } else if (nameClean.includes('Developer Role')) {
                  parsedAnswers.dev_role = valClean;
                } else if (nameClean.includes('Portfolio')) {
                  parsedAnswers.portfolio = valClean;
                } else if (nameClean.includes('Roblox Profile')) {
                  parsedAnswers.roblox_profile = valClean;
                }
              });

              // Extract the Q&As
              embed.fields.forEach(f => {
                const name = f.name.trim();
                if (/^\d+\./.test(name)) {
                  const label = name.replace(/^\d+\.\s*/, '');
                  embedQuestions.push({
                    label: label,
                    value: f.value
                  });
                }
              });

              fromEmbed = true;
            }
          }
        } catch (e) {
          console.error("Failed to fetch application details from Discord, falling back to URL parameters...", e);
        }
      }

      // 2. Fall back to URL parameter if Discord fetch failed or wasn't available
      if (!parsedAnswers && rawAnswers) {
        try {
          const decodedAnswers = decodeURIComponent(rawAnswers);
          if (decodedAnswers.startsWith('c:')) {
            const compressedBase64 = decodedAnswers.substring(2);
            const decompressed = await decompressPayload(compressedBase64);
            if (decompressed) {
              parsedAnswers = JSON.parse(decompressed);
            }
          } else {
            parsedAnswers = JSON.parse(decodedAnswers);
          }
        } catch (e) {
          console.error("Failed to parse answers from URL parameters", e);
        }
      }

      // 3. If still no parsed answers, show error
      if (!parsedAnswers) {
        showError('Invalid URL parameters', 'No valid application answers could be loaded. Please ensure you clicked the correct link from Discord.');
        return;
      }

      // Populating basic info
      applicantName.innerText = parsedAnswers.discord_tag || tagParam;
      applicantId.innerText = `Discord ID: ${parsedAnswers.discord_id || 'N/A'}`;

      const selectedRole = parsedAnswers.role || 'discord_staff';
      const schema = ROLE_SCHEMAS[selectedRole];
      if (schema) {
        document.getElementById('app-subtitle').innerText = `סוקר/ת מועמדות עבור: ${schema.title}`;
      } else if (parsedAnswers.role_title) {
        document.getElementById('app-subtitle').innerText = `סוקר/ת מועמדות עבור: ${parsedAnswers.role_title}`;
      }

      // Update badge initially based on parameter action
      if (actionParam === 'approve') {
        appStatus.innerText = 'נבחר מראש: אישור';
        appStatus.className = 'status-badge status-approved';
      } else if (actionParam === 'reject') {
        appStatus.innerText = 'נבחר מראש: דחייה';
        appStatus.className = 'status-badge status-rejected';
      } else {
        appStatus.innerText = 'ממתין לסקירה';
        appStatus.className = 'status-badge status-pending';
      }

      // Render Questions and Answers
      answersContainer.innerHTML = '';
      if (fromEmbed && embedQuestions.length > 0) {
        // Render basic fields first
        const basicFields = [
          { label: 'שם משתמש בדיסקורד', val: parsedAnswers.discord_tag },
          { label: 'מזהה דיסקורד', val: parsedAnswers.discord_id },
          { label: 'גיל', val: parsedAnswers.age },
          { label: 'אזור זמן / מדינה', val: parsedAnswers.timezone },
          { label: 'שעות בשבוע', val: parsedAnswers.hours_active ? `${parsedAnswers.hours_active} שעות` : null },
          { label: 'התמחות', val: parsedAnswers.media_role },
          { label: 'תפקיד פיתוח', val: parsedAnswers.dev_role },
          { label: 'תיק עבודות', val: parsedAnswers.portfolio },
          { label: 'פרופיל רובלוקס', val: parsedAnswers.roblox_profile }
        ];

        let idx = 1;
        basicFields.forEach(f => {
          if (f.val) {
            const item = document.createElement('div');
            item.className = 'qa-item';
            item.innerHTML = `
              <div class="qa-question">${idx++}. ${f.label}</div>
              <div class="qa-answer">${escapeHTML(f.val)}</div>
            `;
            answersContainer.appendChild(item);
          }
        });

        // Render Q&As from embed
        embedQuestions.forEach(q => {
          const item = document.createElement('div');
          item.className = 'qa-item';
          item.innerHTML = `
            <div class="qa-question">${idx++}. ${q.label}</div>
            <div class="qa-answer">${escapeHTML(q.value)}</div>
          `;
          answersContainer.appendChild(item);
        });
      } else {
        // Fallback: render using schema questions
        const activeQuestions = [
          { id: 'discord_tag', label: 'שם משתמש בדיסקורד' },
          { id: 'discord_id', label: 'מזהה דיסקורד' },
          { id: 'age', label: 'גיל' },
          { id: 'timezone', label: 'אזור זמן / מדינה' }
        ];

        if (schema) {
          schema.questions.forEach(q => {
            activeQuestions.push(q);
          });
        }

        activeQuestions.forEach((q, idx) => {
          const item = document.createElement('div');
          item.className = 'qa-item';
          item.innerHTML = `
            <div class="qa-question">${idx + 1}. ${q.label}</div>
            <div class="qa-answer">${escapeHTML(parsedAnswers[q.id] || 'N/A')}</div>
          `;
          answersContainer.appendChild(item);
        });
      }

      // Hide loading, show content
      loadingView.classList.add('hidden');
      reviewView.classList.remove('hidden');

      // Event handlers for review action
      approveBtn.addEventListener('click', () => submitDecision('approve'));
      rejectBtn.addEventListener('click', () => submitDecision('reject'));
      statusBackBtn.addEventListener('click', () => {
        statusView.classList.add('hidden');
        reviewView.classList.remove('hidden');
      });

      async function submitDecision(action) {
        const reviewerName = reviewerNameInput.value.trim();
        if (!reviewerName) {
          reviewerNameInput.closest('.form-group').classList.add('invalid');
          return;
        }

        reviewerNameInput.closest('.form-group').classList.remove('invalid');
        localStorage.setItem('reviewer_name', reviewerName);

        // Hide form, show status view
        reviewView.classList.add('hidden');
        statusView.classList.remove('hidden');
        statusIconSuccess.classList.add('hidden');
        statusIconError.classList.add('hidden');
        statusBackBtn.classList.add('hidden');
        statusTitle.innerText = 'מעבד...';
        statusMessage.innerText = 'שולח/ת התראת החלטה לדיסקורד. אנא המתן/י.';

        try {
          const isApproved = action === 'approve';
          const embedTitle = isApproved
            ? `🟢 המועמדות אושרה — ${parsedAnswers.discord_tag || tagParam}`
            : `🔴 המועמדות נדחתה — ${parsedAnswers.discord_tag || tagParam}`;

          const embedColor = isApproved ? 3066993 : 15158332; // Green or Red

          // Rebuild fields from parsedAnswers to keep the single-embed format
          const formatEmbedValue = (val, maxLen) => {
            const text = val || 'N/A';
            if (text.length <= maxLen) return text;
            return text.substring(0, maxLen) + '... *(truncated, view full answer in portal)*';
          };
          const safeVal = (v) => (v !== undefined && v !== null && String(v).trim() !== '') ? String(v).trim() : 'N/A';

          const getDecisionEmbedJson = (maxValLen) => {
            const fields = [
              { name: 'תפקיד מבוקש', value: safeVal(schema ? schema.title : 'מועמדות לצוות'), inline: true },
              { name: 'שם משתמש בדיסקורד', value: safeVal(parsedAnswers.discord_tag || tagParam), inline: true },
              { name: 'Discord User ID', value: `\`${safeVal(parsedAnswers.discord_id)}\``, inline: true },
              { name: 'Age', value: safeVal(parsedAnswers.age), inline: true },
              { name: 'Timezone / Country', value: safeVal(parsedAnswers.timezone), inline: true },
              { name: 'Hours / Week', value: parsedAnswers.hours_active ? `${parsedAnswers.hours_active} hrs` : 'N/A', inline: true }
            ];

            if (parsedAnswers.media_role) fields.push({ name: 'Specialization', value: parsedAnswers.media_role, inline: true });
            else if (parsedAnswers.dev_role) fields.push({ name: 'Developer Role', value: parsedAnswers.dev_role, inline: true });

            if (parsedAnswers.portfolio) fields.push({ name: 'Portfolio / Past Work', value: parsedAnswers.portfolio, inline: true });
            if (parsedAnswers.roblox_profile) fields.push({ name: 'Roblox Profile', value: parsedAnswers.roblox_profile, inline: true });

            if (schema) {
              const profileKeys = ['hours_active', 'media_role', 'dev_role', 'roblox_profile', 'portfolio', 'guidelines_agree'];
              const detailQuestions = schema.questions.filter(q => !profileKeys.includes(q.id));
              detailQuestions.forEach((q, idx) => {
                fields.push({
                  name: `${idx + 1}. ${q.label}`,
                  value: formatEmbedValue(parsedAnswers[q.id], maxValLen),
                  inline: false
                });
              });
            }

            return {
              title: embedTitle,
              description:
                `מועמד/ת: **${parsedAnswers.discord_tag || tagParam}** (ID: \`${parsedAnswers.discord_id || 'N/A'}\`)\n` +
                `תפקיד: **${schema ? schema.title : 'מועמדות לצוות'}**\n` +
                `נבדק על ידי: **${reviewerName}**\n` +
                `סטטוס: **${isApproved ? 'אושר' : 'נדחה'}**\n` +
                `זמן החלטה: <t:${Math.floor(Date.now() / 1000)}:f>`,
              color: embedColor,
              fields: fields,
              timestamp: new Date().toISOString()
            };
          };

          const calculateEmbedLength = (embedObj) => {
            let len = 0;
            if (embedObj.title) len += embedObj.title.length;
            if (embedObj.description) len += embedObj.description.length;
            if (embedObj.footer && embedObj.footer.text) len += embedObj.footer.text.length;
            if (embedObj.author && embedObj.author.name) len += embedObj.author.name.length;
            if (embedObj.fields) {
              for (const field of embedObj.fields) {
                if (field.name) len += field.name.length;
                if (field.value) len += field.value.length;
              }
            }
            return len;
          };

          let bestEmbed = null;
          const attemptValLens = [300, 200, 120, 80, 50];
          for (const maxValLen of attemptValLens) {
            const embed = getDecisionEmbedJson(maxValLen);
            const embedLen = calculateEmbedLength(embed);
            if (embedLen <= 5800) {
              bestEmbed = embed;
              console.log(`Chose review decision embed with maxValLen=${maxValLen} (length: ${embedLen})`);
              break;
            }
          }

          if (!bestEmbed) {
            bestEmbed = getDecisionEmbedJson(30);
          }

          const webhookBody = {
            username: 'מערכת סקירת מועמדויות',
            embeds: [bestEmbed],
            components: [] // Clear the components (buttons)
          };

          let res;
          if (messageId && messageId !== 'TEMP_MSG_ID') {
            const patchUrl = `${CONFIG.WEBHOOK_URL}/messages/${messageId}`;
            res = await sendWithRetry(patchUrl, webhookBody, 'PATCH');
          } else {
            res = await sendWithRetry(CONFIG.WEBHOOK_URL, webhookBody, 'POST');
          }

          if (res && (res.ok || res.status === 204)) {
            statusTitle.innerText = `החלטה נשלחה!`;
            statusMessage.innerText = `סומן בהצלחה כ-${isApproved ? 'מאושר' : 'נדחה'}.\nהודעת וובהוק נשלחה לערוץ הדיסקורד שלך.`;
            statusIconSuccess.classList.remove('hidden');

            // Update status badge on review page
            appStatus.innerText = isApproved ? 'מאושר' : 'נדחה';
            appStatus.className = `status-badge ${isApproved ? 'status-approved' : 'status-rejected'}`;

            // Allow back-navigation in case reviewer wants to re-check answers
            statusBackBtn.classList.remove('hidden');
          } else {
            const errText = await res.text();
            throw new Error(`Discord Webhook returned ${res.status}: ${errText}`);
          }
        } catch (err) {
          statusTitle.innerText = 'פעולה נכשלה';
          statusMessage.innerText = err.message || 'לא ניתן היה לשלוח את ההחלטה. אנא בדוק/י את חיבור האינטרנט או את הגדרות הוובהוק.';
          statusIconError.classList.remove('hidden');
          statusBackBtn.classList.remove('hidden');
        }
      }

      function showError(title, msg) {
        loadingView.classList.add('hidden');
        reviewView.classList.add('hidden');
        statusView.classList.remove('hidden');
        statusIconSuccess.classList.add('hidden');
        statusIconError.classList.remove('hidden');
        statusTitle.innerText = title;
        statusMessage.innerText = msg;
      }

      function escapeHTML(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    });
  </script>
</body>
